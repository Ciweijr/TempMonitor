name: Build TempMonitor APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # 固定运行环境，避免 ubuntu-latest 未来自动升级到 Ubuntu 26 带来的不确定性
    runs-on: ubuntu-24.04 
    steps:
      - name: Checkout
        # 升级至 v5 或更高，以兼容 Node 24
        uses: actions/checkout@v5

      - name: Setup JDK 17
        # 升级至 v5，这是解决弃用警告的关键
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        # 升级至 v4，这是 Node 24 兼容版本
        uses: android-actions/setup-android@v4

      - name: Accept licenses & install SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: Setup Gradle
        # 这个 Action 通常不是警告的来源，保持最新稳定版即可
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Create project files
        run: |
          set -e
          # ... 这里是你原来的 Create project files 脚本，内容无需任何修改 ...
          # 请务必保留你原来的这段脚本，我这里只是注释说明，不要直接复制这一行注释

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        # 升级至 v4，这是目前最新且支持 Node 24 的版本
        uses: actions/upload-artifact@v4
        with:
          name: TempMonitor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
